# Retrofit layout: the blueprint root is `Contents.lean`, while the imported
# formalization is tracked as the upstream submodule at `./Noperthedron`.
package_name = "Contents"
blueprint_main = "Main"
formalization_path = "Noperthedron"
# This retrofit has direct-port modules under both Contents/ and Chapters/.
# The explicit LT list below defines the complete source scope.
chapter_root = "."

# Canonical TeX source of truth from the pinned upstream formalization.
tex_source_glob = "Noperthedron/blueprint/src/chapters/*.tex"

[lt]
default_chapters = [
  "Contents/Introduction.lean",
  "Chapters/Noperthedron.lean",
  "Chapters/Prelims.lean",
  "Chapters/Cayley.lean",
  "Chapters/Reduction.lean",
  "Chapters/Certificates.lean",
  "Chapters/PolynomialBounds.lean",
  "Chapters/Data.lean",
  "Chapters/Main.lean",
]

[lt.source_files]
"Contents/Introduction.lean" = ["Noperthedron/blueprint/src/chapters/intro.tex"]
"Chapters/Noperthedron.lean" = ["Noperthedron/blueprint/src/chapters/noperthedron.tex"]
"Chapters/Prelims.lean" = ["Noperthedron/blueprint/src/chapters/prelims.tex"]
"Chapters/Cayley.lean" = ["Noperthedron/blueprint/src/chapters/cayley.tex"]
"Chapters/Reduction.lean" = ["Noperthedron/blueprint/src/chapters/reduction.tex"]
"Chapters/Certificates.lean" = ["Noperthedron/blueprint/src/chapters/certificates.tex"]
"Chapters/PolynomialBounds.lean" = ["Noperthedron/blueprint/src/chapters/polybounds.tex"]
"Chapters/Data.lean" = ["Noperthedron/blueprint/src/chapters/data.tex"]
"Chapters/Main.lean" = ["Noperthedron/blueprint/src/chapters/main.tex"]

[harness]
max_missing_mathlib_modules = 2
native_warnings = false
strict_external_code = true
